name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runtime
        run: npm run build

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Verify offline Responses provider contract
        run: npx vitest run test/llmProviderContract.test.js

      - name: Verify CLI help entrypoints
        run: |
          node dist/cli.js --help
          node dist/cli.js solve --help
          node dist/cli.js logs --help
          node dist/cli.js knowledge --help
          node dist/cli.js knowledge prepare --help
          node dist/cli.js knowledge build --help
          node dist/cli.js knowledge search --help
          node dist/cli.js knowledge man --help

      - name: Verify packed contents
        run: npm pack --dry-run

      - name: Verify global install from tarball
        run: |
          PACKAGE_TGZ="$(npm pack --foreground-scripts=false)"
          REPOSITORY_ROOT="$PWD"
          INSTALL_PREFIX="$(mktemp -d)"
          npm install -g --prefix "$INSTALL_PREFIX" "./${PACKAGE_TGZ}"
          GLOBAL_MODULE_ROOT="$(npm root -g --prefix "$INSTALL_PREFIX")"
          export PATH="$INSTALL_PREFIX/bin:$PATH"
          cd "$(mktemp -d)"
          shellgeiai --help
          shellgeiai solve --help
          shellgeiai logs --help
          shellgeiai knowledge --help
          shellgeiai knowledge prepare --help
          shellgeiai knowledge build --help
          shellgeiai knowledge search --help
          shellgeiai knowledge man --help
          node --input-type=module -e '
            import { pathToFileURL } from "node:url";
            import { readFile } from "node:fs/promises";
            const { DEFAULT_KNOWLEDGE_DATASET } = await import(pathToFileURL(process.argv[1]));
            if (!DEFAULT_KNOWLEDGE_DATASET.endsWith("shellgei-basic.jsonl")) throw new Error("Unexpected bundled dataset");
            const records = (await readFile(DEFAULT_KNOWLEDGE_DATASET, "utf8")).trim().split("\n");
            if (!records.length || !JSON.parse(records[0]).id) throw new Error("Missing bundled seed records");
          ' "${GLOBAL_MODULE_ROOT}/shellgeiai/dist/knowledge/config.js"
          node --input-type=module -e '
            import { pathToFileURL } from "node:url";
            import path from "node:path";
            const { buildKnowledgeVectors, searchKnowledge } = await import(pathToFileURL(process.argv[1]));
            const vector = Array.from({ length: 4096 }, (_, index) => index === 0 ? 1 : 0);
            const embedder = {
              embed: async () => vector,
              embedBatch: async texts => texts.map(() => vector)
            };
            const dbPath = path.resolve("knowledge.sqlite");
            const built = await buildKnowledgeVectors({ dbPath, embedder });
            if (built.dimensions !== 4096 || built.itemCount < 1) throw new Error("Installed package build failed");
            const searched = await searchKnowledge({ query: "CSV", dbPath, embedder, topK: 5 });
            if (!searched.results.length || Math.abs(searched.results[0].score - 1) > 0.000001) throw new Error("Installed package cosine search failed");
          ' "${GLOBAL_MODULE_ROOT}/shellgeiai/dist/knowledge/commands.js"
          node --input-type=module -e '
            import { mkdirSync, readdirSync, symlinkSync, writeFileSync } from "node:fs";
            import path from "node:path";
            const dist = path.join(process.argv[1], "shellgeiai/dist");
            const nodeTypes = path.join(process.cwd(), "consumer-types");
            mkdirSync(nodeTypes);
            symlinkSync(path.join(process.argv[2], "node_modules/@types/node"), path.join(nodeTypes, "node"), "dir");
            const declarations = directory => readdirSync(directory, { withFileTypes: true }).flatMap(entry => {
              const filename = path.join(directory, entry.name);
              return entry.isDirectory() ? declarations(filename) : filename.endsWith(".d.ts") ? [filename] : [];
            });
            const files = declarations(dist);
            if (files.length !== 31) throw new Error("Expected 31 published declarations");
            writeFileSync("consumer.mts", files.map((file, index) => `import type * as Module${index} from ${JSON.stringify(file.replace(/\.d\.ts$/, ".js"))};`).join("\n"));
            writeFileSync("tsconfig.json", JSON.stringify({ compilerOptions: { target: "ES2022", module: "NodeNext", moduleResolution: "NodeNext", strict: true, skipLibCheck: false, noEmit: true, types: ["node"], typeRoots: [nodeTypes] }, files: ["consumer.mts"] }));
          ' "$GLOBAL_MODULE_ROOT" "$REPOSITORY_ROOT"
          node "$REPOSITORY_ROOT/node_modules/typescript/bin/tsc" -p tsconfig.json
